  dtype: int8
  dim: 100
  base_file:  /workspace/datasets_nfs/SPACEV1B/spacev300M_base.i8bin
  query_file: /experiments/artifacts/spacev100M/gt/gt_lits_k4_iter150_K10_Q10000_queries.npy
  gt_file:    /experiments/artifacts/spacev100M/gt/gt_lits_k4_iter150_K10_Q10000.npy
  graph_file: /experiments/artifacts/spacev100M/graph/checkpoints/lits_k4_iter150
