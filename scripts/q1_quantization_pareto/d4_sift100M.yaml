# D4 campaign (MR#8 within-system sweep) — sift100M, SP(lits) graph ONLY.
# Code budget rule: one byte per four vector dimensions (M = dim/4 = 32).
# Codes = pq/M32_active (08-15, full-range [0,300M) encoding) — the ONLY M32
# vintage that still exists (the 08-06 window-encoded original was replaced);
# the whole curve is measured fresh on this vintage, so provenance is uniform.
# exact in same run for provenance parity. 2026-08-21 decision: no B rerun.
_common: &common
  dtype: uint8
  dim: 128
  max_points: 100000000
  max_capacity: 300000000
  base_file:   /workspace/datasets_nfs/SIFT1B/sift300M_base.bin
  pq_codebook: /experiments/artifacts/sift100M/pq/M32_active/pq_codebook.bin
  pq_codes:    /experiments/artifacts/sift100M/pq/M32_active/pq_all_codes.bin
  query_file:  /experiments/artifacts/sift100M/gt/gt_iteration150_K10_Q10000_queries.npy
  gt_file:     /experiments/artifacts/sift100M/gt/gt_iteration150_K10_Q10000.npy
  id_offset: 0
  R: 64
  L_build: 100
  K: 10
  L_search: 100
  L_search_sweep: [50, 75, 100, 125, 150, 200, 250, 300, 350, 400]
  conv_window: 3
  conv_threshold_pct: 1.0
  n_query: null
  num_threads: 64
  max_drops: 100000
  q1_modes: exact,pq,pq_rerank
  q1_rerank_scope: beam
  q1_partitions: [balanced, centroid, nc, lits]
  partitions:
    - {name: balanced, M: 4, path: /experiments/artifacts/sift100M/partition/4_partitions_round_robin/partition_ids.npy}
    - {name: centroid, M: 4, path: /experiments/artifacts/sift100M/partition/4_partitions_nearest_centroid_balanced/partition_ids.npy}
    - {name: nc,       M: 4, path: /experiments/artifacts/sift100M/partition/4_partitions_nearest_centroid/partition_ids.npy}
    - {name: lits,     M: 4, path: /experiments/artifacts/sift100M/partition/4_partitions_lits_balanced/partition_ids.npy}

datasets:
  sift100M_SP_lits150_m32:
    <<: *common
    graph_file: /experiments/artifacts/sift100M/graph/checkpoints/lits_k4_iter150
    tags_file:  /experiments/artifacts/sift100M/graph/checkpoints/lits_k4_iter150.tags
