# MR#8 OPQ D/4 arm, REBUILD v2 (2026-08-21) — supersedes d4_sift100M_opq.yaml.
#
# v1 (pq/M32_opq) used faiss OPQMatrix's default RANDOM rotation init and a
# 200K codebook sample. Measured held-out reconstruction error vs plain PQ on
# the same sample: deep 0.86x (helps) but spacev 1.25x and sift 1.56x (HURTS),
# which is why v1 lost 3.0-3.5pp pq-only on those two. Not a harness bug — the
# LUT identity LUT(R q) == ||q - x_hat||^2 holds to 1e-6 and the stored codes
# re-encode 100% identically; the rotation itself is just a worse local optimum.
#
# v2 (pq/M32_opq_v2) trains BOTH random- and identity-initialised rotations and
# keeps whichever wins on a held-out slice (OPQ is a refinement of PQ and must
# never lose to it), with the codebook trained on 1M rows to match the shipped
# M*_active pipeline protocol. Expected: deep keeps its gain, spacev/sift land
# on the plain-PQ curve instead of below it.
#
# Everything else is identical to d4_sift100M.yaml (SP=lits_k4_iter150, beam scope,
# same L grid, queries, GT, partition labels). RECALL ONLY — timing invalid.
_common: &common
  dtype: uint8
  dim: 128
  max_points: 100000000
  max_capacity: 300000000
  base_file:   /workspace/datasets_nfs/SIFT1B/sift300M_base.bin
  pq_codebook: /experiments/artifacts/sift100M/pq/M32_opq_v2/pq_codebook.bin
  opq_rotation: /experiments/artifacts/sift100M/pq/M32_opq_v2/opq_rotation.npy
  pq_codes:    /experiments/artifacts/sift100M/pq/M32_opq_v2/pq_all_codes.bin
  query_file:  /experiments/artifacts/sift100M/gt/gt_iteration150_K10_Q10000_queries.npy
  gt_file:     /experiments/artifacts/sift100M/gt/gt_iteration150_K10_Q10000.npy
  id_offset: 0
  R: 64
  L_build: 100
  K: 10
  L_search: 100
  L_search_sweep: [50, 75, 100, 125, 150, 200, 250, 300, 350, 400]
  conv_window: 3
  conv_threshold_pct: 1.0
  n_query: null
  num_threads: 64
  max_drops: 100000
  q1_modes: exact,pq,pq_rerank
  q1_rerank_scope: beam
  q1_partitions: [balanced, centroid, nc, lits]
  partitions:
    - {name: balanced, M: 4, path: /experiments/artifacts/sift100M/partition/4_partitions_round_robin/partition_ids.npy}
    - {name: centroid, M: 4, path: /experiments/artifacts/sift100M/partition/4_partitions_nearest_centroid_balanced/partition_ids.npy}
    - {name: nc,       M: 4, path: /experiments/artifacts/sift100M/partition/4_partitions_nearest_centroid/partition_ids.npy}
    - {name: lits,     M: 4, path: /experiments/artifacts/sift100M/partition/4_partitions_lits_balanced/partition_ids.npy}

datasets:
  sift100M_SP_lits150_m32_opq_v2:
    <<: *common
    graph_file: /experiments/artifacts/sift100M/graph/checkpoints/lits_k4_iter150
    tags_file:  /experiments/artifacts/sift100M/graph/checkpoints/lits_k4_iter150.tags
