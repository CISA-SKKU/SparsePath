# A1-M (M08) — deep100M B-q rerun with M=32 PQ codes (32B/vec, 12x compression).
# Fills the baseline code-budget curve between M12 (12B, 0.737) and SQ8 (96B,
# 0.994 w/ rerank). Same graph/GT/labels as a1_deep100M.yaml; only pq artifacts
# and modes differ. CONTAINER paths (worker-host danns).
_common: &common
  dtype: float32
  dim: 96
  max_points: 100000000
  max_capacity: 300000000
  base_file:   /workspace/datasets_nfs/DEEP1B/deep300M_base.fbin
  pq_codebook: /experiments/artifacts/deep100M/pq/M32/pq_codebook.bin
  pq_codes:    /experiments/artifacts/deep100M/pq/M32/pq_all_codes.bin
  query_file:  /experiments/artifacts/deep100M/gt/gt_iteration150_K10_Q10000_queries.npy
  gt_file:     /experiments/artifacts/deep100M/gt/gt_iteration150_K10_Q10000.npy
  id_offset: 0
  R: 64
  L_build: 100
  K: 10
  L_search: 100
  L_search_sweep: [50, 100, 150, 200, 250, 300, 350, 400]
  conv_window: 3
  conv_threshold_pct: 1.0
  n_query: null
  num_threads: 64
  max_drops: 100000
  q1_modes: pq,pq_rerank
  q1_rerank_scope: beam
  q1_partitions: [balanced, centroid, nc, lits]
  partitions:
    - {name: balanced, M: 4, path: /experiments/artifacts/deep100M/partition/4_partitions_round_robin/partition_ids.npy}
    - {name: centroid, M: 4, path: /experiments/artifacts/deep100M/partition/4_partitions_nearest_centroid_balanced/partition_ids.npy}
    - {name: nc,       M: 4, path: /experiments/artifacts/deep100M/partition/4_partitions_nearest_centroid/partition_ids.npy}
    - {name: lits,     M: 4, path: /experiments/artifacts/deep100M/partition/4_partitions_lits_balanced/partition_ids.npy}

datasets:
  deep100M_B_iter150_m32:
    <<: *common
    graph_file: /experiments/artifacts/deep100M/graph/checkpoints/iteration150
    tags_file:  /experiments/artifacts/deep100M/graph/checkpoints/iteration150.tags
